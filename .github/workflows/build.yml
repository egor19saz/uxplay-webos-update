name: Build UxPlay webOS IPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl python3 pkg-config libtool autoconf automake texinfo yasm nasm wget ca-certificates xz-utils bzip2 file binutils

      - name: Download and install webOS NDK
        run: |
          NDK_URL="https://github.com/webosbrew/meta-lg-webos-ndk/releases/download/1.0.g-rev.5/webos-sdk-x86_64-armv7a-neon-toolchain-1.0.g.sh"
          NDK_INSTALLER="/tmp/ndk.sh"
          NDK_DIR="/opt/webos-ndk"
          
          echo "Downloading webOS NDK..."
          curl -fL --retry 5 --connect-timeout 30 "$NDK_URL" -o "$NDK_INSTALLER"
          chmod +x "$NDK_INSTALLER"
          
          echo "Installing NDK..."
          sudo mkdir -p "$NDK_DIR"
          sudo bash "$NDK_INSTALLER" -y -d "$NDK_DIR"
          
          echo "Listing NDK contents..."
          ls -la "$NDK_DIR/" || true
          ls -la "$NDK_DIR/1.0.g/" 2>/dev/null || true
          
          TOOLCHAIN_DIR=$(find "$NDK_DIR" -name "arm-webos-linux-gnueabi-gcc" -type f 2>/dev/null | head -1 | xargs dirname 2>/dev/null || true)
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "ERROR: arm-webos-linux-gnueabi-gcc not found!"
            find "$NDK_DIR" -type f -name "*gcc*" 2>/dev/null | head -20
            exit 1
          fi
          
          echo "Toolchain found at: $TOOLCHAIN_DIR"
          
          SYSROOT_DIR=$(find "$NDK_DIR" -type d -name "sysroot" 2>/dev/null | head -1 || true)
          if [ -z "$SYSROOT_DIR" ]; then
            SYSROOT_DIR=$(find "$NDK_DIR" -type d -name "armv7a-neon-webos-linux-gnueabi" 2>/dev/null | head -1 || true)
          fi
          echo "Sysroot found at: $SYSROOT_DIR"
          
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> $GITHUB_ENV
          echo "SYSROOT_DIR=$SYSROOT_DIR" >> $GITHUB_ENV
          echo "NDK_DIR=$NDK_DIR" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          echo "PATH=$TOOLCHAIN_DIR:$PATH"
          export PATH="$TOOLCHAIN_DIR:$PATH"
          which arm-webos-linux-gnueabi-gcc || true
          arm-webos-linux-gnueabi-gcc --version || true

      - name: Build OpenSSL
        run: |
          export PATH="$TOOLCHAIN_DIR:$PATH"
          export CC=arm-webos-linux-gnueabi-gcc
          export CXX=arm-webos-linux-gnueabi-g++
          export AR=arm-webos-linux-gnueabi-ar
          export RANLIB=arm-webos-linux-gnueabi-ranlib
          export SYSROOT="$SYSROOT_DIR"
          export CFLAGS="--sysroot=$SYSROOT -O2 -fPIC"
          export CXXFLAGS="$CFLAGS -D_GLIBCXX_USE_CXX11_ABI=0"
          export LDFLAGS="--sysroot=$SYSROOT"
          
          mkdir -p .cache/deps build/logs
          
          curl -fL --retry 5 --connect-timeout 30 "https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz" -o .cache/openssl.tar.gz
          tar -xzf .cache/openssl.tar.gz -C .cache/
n          cd .cache/openssl-3.5.8
          ./Configure linux-armv4 no-shared no-tests no-module no-async --prefix=$PWD/../deps --libdir=lib
          make -j$(nproc) build_libs
          make install_dev
          cd ../..

      - name: Build libplist
        run: |
          export PATH="$TOOLCHAIN_DIR:$PATH"
          export CC=arm-webos-linux-gnueabi-gcc
          export CXX=arm-webos-linux-gnueabi-g++
          export AR=arm-webos-linux-gnueabi-ar
          export RANLIB=arm-webos-linux-gnueabi-ranlib
          export SYSROOT="$SYSROOT_DIR"
          export CFLAGS="--sysroot=$SYSROOT -O2 -fPIC"
          export CXXFLAGS="$CFLAGS -D_GLIBCXX_USE_CXX11_ABI=0"
          export LDFLAGS="--sysroot=$SYSROOT"
          
          curl -fL --retry 5 --connect-timeout 30 "https://github.com/libimobiledevice/libplist/releases/download/2.7.0/libplist-2.7.0.tar.bz2" -o .cache/libplist.tar.bz2
          tar -xjf .cache/libplist.tar.bz2 -C .cache/
          cd .cache/libplist-2.7.0
          ./configure --host=arm-webos-linux-gnueabi --prefix=$PWD/../deps --disable-shared --enable-static --without-cython --without-tests CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS" LDFLAGS="$LDFLAGS"
          make -j$(nproc)
          make install
          cd ../..

      - name: Build FFmpeg
        run: |
          export PATH="$TOOLCHAIN_DIR:$PATH"
          export CC=arm-webos-linux-gnueabi-gcc
          export CXX=arm-webos-linux-gnueabi-g++
          export SYSROOT="$SYSROOT_DIR"
          export CFLAGS="--sysroot=$SYSROOT -O2 -fPIC"
          export CXXFLAGS="$CFLAGS -D_GLIBCXX_USE_CXX11_ABI=0"
          export LDFLAGS="--sysroot=$SYSROOT"
          
          curl -fL --retry 5 --connect-timeout 60 --max-time 300 "https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz" -o .cache/ffmpeg.tar.xz
          tar -xJf .cache/ffmpeg.tar.xz -C .cache/
          cd .cache/ffmpeg-8.1.2
          ./configure --prefix=$PWD/../deps --arch=arm --cpu=cortex-a9 --target-os=linux --enable-cross-compile --sysroot="$SYSROOT" --extra-cflags="-Dstatic_assert=_Static_assert" --cross-prefix=arm-webos-linux-gnueabi- --disable-everything --disable-programs --disable-doc --disable-shared --enable-static --enable-pic --disable-autodetect --disable-network --disable-avdevice --disable-avformat --disable-avfilter --disable-swscale --enable-avcodec --enable-avutil --enable-swresample --enable-decoder=aac,alac,pcm_s16le --enable-parser=h264 --enable-small --disable-debug
          make -j$(nproc)
          make install
          cd ../..

      - name: Build UxPlay webOS
        run: |
          export PATH="$TOOLCHAIN_DIR:$PATH"
          
          git clone --depth 1 https://github.com/FDH2/UxPlay.git vendor/uxplay
          
          mkdir -p build
          cat > build/toolchain
